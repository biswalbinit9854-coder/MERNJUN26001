<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     
    <style>
.card{
    width:300px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    margin:50px auto;
    box-shadow:0 0 10px gray;
}

.top{
    height:180px;
    background:#b8f0c5;
    text-align:center;
    line-height:180px;
    font-size:50px;
}

.content{
    padding:20px;
}

.label{
    background:lightgray;
    padding:5px 15px;
    border-radius:15px;
    display:inline-block;
}

button{
    width:100%;
    padding:12px;
    background:#5b7cff;
    color:white;
    border:none;
    border-radius:20px;
    font-size:18px;
}
</style>


<body>
<div class="card">

    <div class="top"></div>

    <div class="content">
        <span class="label">Label</span>

        <h2>Heading</h2>

        <p>This is a short description about the card.</p>

        <button>Action</button>
    </div>
<div class="container">

    <div class="card">
        <h2>Assess</h2>
        <p>Test your design skills and establish benchmarks.</p>
    </div>

    <div class="card">
        <h2>Learn</h2>
        <p>Access a design library of course.</p>
    </div>

    <div class="card">
        <h2>Showcase</h2>
        <p>Every skill you learn is automatically recorded on profile.</p>
    </div>

</div>

</div>
</body>
</html>
